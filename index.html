<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAF E-Learning Catalog</title>
    <link rel="stylesheet" href="styles.css?v=20260511-2" />
  </head>
  <body>
    <main class="shell">
      <section class="intro" aria-labelledby="catalog-title">
        <p class="eyebrow">ANG Training Reference</p>
        <h1 id="catalog-title">DAF E-Learning Catalog</h1>
      </section>

      <section class="catalog-app" aria-label="Course catalog book">
        <aside class="rail" aria-label="Catalog controls">
          <div>
            <div class="rail-heading">
              <p class="rail-label">Browse</p>
              <div class="view-toggle" aria-label="Catalog view">
                <button type="button" data-view-mode="desktop">Desktop</button>
                <button type="button" data-view-mode="mobile">Mobile</button>
              </div>
            </div>
            <p class="view-note view-note-desktop">Desktop mode includes direct training links when available.</p>
            <p class="view-note view-note-mobile">Training links are hidden on mobile. Switch to Desktop mode to access direct links.</p>
            <div class="search-panel">
              <label class="search-label" for="courseSearch">Search</label>
              <input
                class="search-input"
                id="courseSearch"
                type="search"
                placeholder="Course, rule, topic..."
                autocomplete="off"
              />
              <div class="search-results" id="searchResults" aria-live="polite"></div>
            </div>
            <div class="discipline-list" id="disciplineList"></div>
          </div>
        </aside>

        <div class="book-area">
          <div class="book" id="book" aria-live="polite">
            <article class="page page-left" id="leftPage"></article>
            <article class="page page-right" id="rightPage"></article>
          </div>

          <nav class="page-controls" aria-label="Page controls">
            <button class="icon-button" id="prevBtn" type="button" aria-label="Previous spread">
              <span aria-hidden="true">‹</span>
            </button>
            <div class="dots" id="dots" aria-label="Spread navigation"></div>
            <button class="icon-button" id="nextBtn" type="button" aria-label="Next spread">
              <span aria-hidden="true">›</span>
            </button>
          </nav>
        </div>
      </section>
    </main>

    <script src="app.js?v=20260511-2"></script>
  </body>
</html>
